# DOSBox-X 2024.03.01 PC-98 settings for scripts/run_game_hdi.py, after the
# user's th02_jp.conf (Pentium, 15000 cycles, 32 MB) and TH04's headless runs
# (the normal core; Linux's dynamic core aborted after a PC-98 reset there).
[sdl]
fullscreen = false
output = surface
autolock = false
waitonerror = false
showmenu = false

[dosbox]
machine = pc98
memsize = 32
fastbioslogo = true
startbanner = false
quit warning = false

[pc98]
pc-98 fm board = board86c
pc-98 enable grcg = true
pc-98 enable egc = true

[cpu]
core = normal
cputype = pentium
cycles = fixed 15000

[mixer]
nosound = true

[midi]
mpu401 = none
mididevice = none

[dos]
keyboardlayout = none
